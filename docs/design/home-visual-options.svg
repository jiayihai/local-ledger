    <rect x="22" y="354" width="366" height="94" rx="18" fill="#fff" stroke="#191919" stroke-width="1.5"/>
    <text x="39" y="391" class="label">恋爱</text><text x="39" y="418" class="small quiet">本月支出</text><text x="309" y="407" text-anchor="end" class="dense-value">600.00</text><text x="371" y="406" text-anchor="end" class="small quiet">明细 ›</text>
