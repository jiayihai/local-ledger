    <text x="39" y="497" class="label">收入</text><text x="39" y="524" class="small quiet">本月收入</text><text x="309" y="513" text-anchor="end" class="dense-value red">8,000.00</text><text x="371" y="512" text-anchor="end" class="small quiet">明细 ›</text>
    <text x="26" y="599" class="body quiet">＋ 新建大类</text>
    <line x1="1" y1="710" x2="409" y2="710" stroke="#e4e4e4"/>
    <text x="70" y="754" text-anchor="middle" class="body">记账</text><text x="205" y="754" text-anchor="middle" class="body quiet">明细</text><text x="340" y="754" text-anchor="middle" class="body quiet">设置</text>
  </g>
  <text x="40" y="949" class="body">两种方案使用相同功能与记账流程，可组合喜欢的细节。</text>
  <text x="40" y="981" class="small quiet">需求讨论稿 v0.4 · 金额均为示例 · 视觉与页面安排待确认</text>
