<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1010" viewBox="0 0 960 1010" role="img" aria-labelledby="title desc">
  <title id="title">记账首页的留白卡片与紧凑分区视觉方案</title>
  <desc id="desc">两版均为纵向圆角矩形卡片。个人和恋爱支出黑框，收入红框，卡片包含名称、本月累计和明细入口。留白卡片将名称、金额纵向排列，紧凑分区将名称与金额横向排列。数据均为示例。</desc>
  <style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#191919;font-weight:400}.quiet{fill:#666}.red{fill:#c72d39}.small{font-size:14px}.body{font-size:17px}.label{font-size:20px;font-weight:500}.title{font-size:29px;font-weight:500}.value{font-size:29px;font-weight:500}.dense-value{font-size:23px;font-weight:500}</style>
  <rect width="960" height="1010" fill="#f0f0f0"/>
  <text x="40" y="47" class="title">留白卡片</text><text x="510" y="47" class="title">紧凑分区</text>
  <text x="40" y="79" class="body quiet">金额突出 · 层次柔和</text><text x="510" y="79" class="body quiet">排列紧凑 · 便于快速选择</text>
  <g transform="translate(40 109)">
    <rect x="1" y="1" width="408" height="788" rx="34" fill="#f6f6f6" stroke="#d0d0d0"/>
