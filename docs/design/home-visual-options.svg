    <text x="25" y="96" class="title">记账</text><text x="382" y="94" text-anchor="end" class="small quiet">本地总账</text>
    <text x="25" y="132" class="small quiet">2026年11月</text>
    <text x="25" y="173" class="small quiet">本月支出</text><text x="230" y="173" class="small quiet">本月收入</text>
    <text x="25" y="205" class="dense-value">¥ 1,860.00</text><text x="230" y="205" class="dense-value red">¥ 8,000.00</text>
    <rect x="22" y="232" width="366" height="122" rx="24" fill="#fff" stroke="#191919" stroke-width="1.3"/>
    <text x="42" y="267" class="label">个人</text><text x="42" y="291" class="small quiet">本月支出</text><text x="42" y="329" class="value">1,260.00</text><text x="369" y="299" text-anchor="end" class="small quiet">明细 ›</text>
    <rect x="22" y="370" width="366" height="122" rx="24" fill="#fff" stroke="#191919" stroke-width="1.3"/>
    <text x="42" y="405" class="label">恋爱</text><text x="42" y="429" class="small quiet">本月支出</text><text x="42" y="467" class="value">600.00</text><text x="369" y="437" text-anchor="end" class="small quiet">明细 ›</text>
    <rect x="22" y="508" width="366" height="122" rx="24" fill="#fff" stroke="#c72d39" stroke-width="1.3"/>
    <text x="42" y="543" class="label">收入</text><text x="42" y="567" class="small quiet">本月收入</text><text x="42" y="605" class="value red">8,000.00</text><text x="369" y="575" text-anchor="end" class="small quiet">明细 ›</text>
    <text x="205" y="675" text-anchor="middle" class="body quiet">＋ 新建大类</text>
    <path d="M1 710H409V755Q409 789 375 789H35Q1 789 1 755Z" fill="#fff"/>
    <line x1="1" y1="710" x2="409" y2="710" stroke="#e4e4e4"/>
