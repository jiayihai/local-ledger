  <script>
    (() => {
      const root=document.getElementById('ledger-visual-v4');
      const template=document.getElementById('ledger-visual-template-v4');
      const saved=window.openai&&window.openai.widgetState;
      const prefs=saved&&saved.privateContent&&saved.privateContent.visualV4||{};
      const restorers=[];
      const groups={personal:{name:'个人',kind:'expense',base:126000,sub:['饮食','娱乐','会员']},love:{name:'恋爱',kind:'expense',base:60000,sub:['饮食','礼物','约会']},income:{name:'收入',kind:'income',base:800000,sub:['工资','奖金','其他收入']}};
      const examples=[{group:'personal',sub:'饮食',cents:3800,date:'2026-11-17'},{group:'love',sub:'礼物',cents:12800,date:'2026-11-16'},{group:'income',sub:'工资',cents:800000,date:'2026-11-15'}];
      const money=cents=>(cents/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
      root.querySelectorAll('.lv-phone').forEach(phone=>{
        phone.appendChild(template.content.cloneNode(true));
        const state={current:null,pending:null,records:[],radius:phone.dataset.design==='compact'?18:24,border:phone.dataset.design==='compact'?1.5:1.3};
        const overlay=phone.querySelector('.lv-overlay'),notice=phone.querySelector('.lv-notice');
        const amount=phone.querySelector('[name="amount"]'),date=phone.querySelector('[name="date"]');
        let timer;
        function applyAppearance(value){if(value&&Number.isFinite(value.radius))state.radius=Math.max(14,Math.min(28,value.radius));if(value&&Number.isFinite(value.border))state.border=Math.max(1,Math.min(2,value.border));phone.style.setProperty('--lv-radius',state.radius+'px');phone.style.setProperty('--lv-border',state.border+'px');}
        function persist(){prefs[phone.dataset.design]={radius:state.radius,border:state.border};if(window.openai&&typeof window.openai.setWidgetState==='function'){const result=window.openai.setWidgetState({modelContent:{illustrationOnly:true},privateContent:{visualV4:prefs}});if(result&&typeof result.catch==='function')result.catch(()=>{});}}
        applyAppearance(prefs[phone.dataset.design]);restorers.push(()=>applyAppearance(prefs[phone.dataset.design]));
        function show(page){phone.querySelectorAll('[data-page]').forEach(el=>el.hidden=el.dataset.page!==page);phone.querySelectorAll('[data-nav]').forEach(button=>{if(button.dataset.nav===page)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});overlay.hidden=true;state.pending=null;notice.hidden=true;clearTimeout(timer);}
        function totals(){let income=0,expense=0;Object.entries(groups).forEach(([key,group])=>{const sum=group.base+state.records.filter(record=>record.group===key&&record.date.startsWith('2026-11')).reduce((a,r)=>a+r.cents,0);phone.querySelector('[data-value="'+key+'"]').textContent=money(sum);if(group.kind==='income')income+=sum;else expense+=sum;});phone.querySelector('[data-sum="income"]').textContent='¥ '+money(income);phone.querySelector('[data-sum="expense"]').textContent='¥ '+money(expense);const difference=income-expense;phone.querySelector('[data-sum="balance"]').textContent=(difference<0?'− ¥ ':'¥ ')+money(Math.abs(difference));}
        function details(key){show('details');phone.querySelector('.lv-detail-title').textContent=key?groups[key].name+'明细':'明细';const mount=phone.querySelector('.lv-records');mount.replaceChildren();[...state.records].reverse().concat(examples).filter(record=>!key||record.group===key).slice(0,5).forEach(record=>{const group=groups[record.group],row=document.createElement('div'),labels=document.createElement('div'),name=document.createElement('span'),when=document.createElement('span'),value=document.createElement('span');row.className='lv-record';row.dataset.kind=group.kind;name.textContent=group.name+' / '+record.sub;when.className='lv-quiet';when.textContent=record.date;value.className='lv-record-value'+(group.kind==='income'?' lv-red':'');value.textContent=(group.kind==='income'?'+ ':'− ')+money(record.cents);labels.append(name,when);row.append(labels,value);mount.appendChild(row);});}
        phone.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',()=>button.dataset.nav==='details'?details(null):show(button.dataset.nav)));
        phone.querySelectorAll('[data-home]').forEach(button=>button.addEventListener('click',()=>show('home')));
        phone.querySelectorAll('[data-detail]').forEach(button=>button.addEventListener('click',()=>details(button.dataset.detail)));
        phone.querySelectorAll('[data-entry]').forEach(button=>button.addEventListener('click',()=>{show('entry');state.current=button.dataset.entry;const group=groups[state.current];phone.dataset.kind=group.kind;phone.querySelector('.lv-entry-name').textContent=group.name;phone.querySelector('.lv-entry-kind').textContent=group.kind==='income'?'收入':'支出';amount.value=state.current==='personal'?'38.00':state.current==='income'?'100.00':'128.00';date.value='2026-11-17';phone.querySelector('[name="note"]').value='';phone.querySelector('.lv-feedback').textContent='';amount.focus();}));
        phone.querySelector('.lv-confirm').addEventListener('click',()=>{const raw=amount.value.trim();if(!/^\d+(\.\d{1,2})?$/.test(raw)||!Number.isFinite(Number(raw))||Number(raw)<=0||Number(raw)>999999999.99){phone.querySelector('.lv-feedback').textContent='请输入大于零、最多两位小数的金额';amount.focus();return;}if(!date.validity.valid||!/^\d{4}-\d{2}-\d{2}$/.test(date.value)){phone.querySelector('.lv-feedback').textContent='请选择有效日期';date.focus();return;}state.pending={group:state.current,cents:Math.round(Number(raw)*100),date:date.value};const group=groups[state.current];phone.querySelector('.lv-sheet h3').textContent=group.name+' · 选择小类';const value=phone.querySelector('.lv-chosen-amount');value.textContent=(group.kind==='income'?'+ ¥ ':'− ¥ ')+money(state.pending.cents);value.classList.toggle('lv-red',group.kind==='income');const options=phone.querySelector('.lv-choices');options.replaceChildren();group.sub.forEach(sub=>{const button=document.createElement('button');button.type='button';button.className='cursor-interaction';button.textContent=sub;button.addEventListener('click',()=>{if(!state.pending||overlay.hidden)return;const record={...state.pending,sub};state.records.push(record);show('home');totals();notice.textContent='示例已保存：'+group.name+' / '+sub+' / '+money(record.cents)+' 元';notice.hidden=false;timer=setTimeout(()=>notice.hidden=true,5000);phone.querySelector('[data-entry="'+record.group+'"]').focus();});options.appendChild(button);});overlay.hidden=false;options.querySelector('button').focus();});
        phone.querySelector('.lv-dismiss').addEventListener('click',()=>{overlay.hidden=true;state.pending=null;amount.focus();});
        overlay.addEventListener('keydown',event=>{if(event.key==='Escape'){overlay.hidden=true;state.pending=null;amount.focus();}if(event.key==='Tab'){const buttons=Array.from(overlay.querySelectorAll('button')),first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
        phone.querySelectorAll('button').forEach(button=>button.classList.add('cursor-interaction'));
        if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{applyAppearance(state);persist();}});tweak.addSlider(state,'radius',{label:'卡片圆角',min:14,max:28,unit:'px'});tweak.addSlider(state,'border',{label:'边框粗细',min:1,max:2,step:0.1,unit:'px'});}
      });
      window.addEventListener('openai:set_globals',event=>{const next=event.detail&&event.detail.globals&&event.detail.globals.widgetState;if(next&&next.privateContent&&next.privateContent.visualV4){Object.assign(prefs,next.privateContent.visualV4);restorers.forEach(restore=>restore());}});
    })();
  </script>
